---
# Install locally with:
#   pip install pre-commit && pre-commit install
# Run against the whole tree:
#   pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=200]

  - repo: https://github.com/pre-commit/mirrors-clang-format
    rev: v18.1.3
    hooks:
      - id: clang-format
        types_or: [c, c++]

  # Every C source and header must carry an SPDX license identifier.
  - repo: local
    hooks:
      - id: spdx-license-header
        name: SPDX license header
        language: pygrep
        entry: 'SPDX-License-Identifier: \S+'
        args: [--negate]
        files: \.(c|h)$|\.h\.in$

  # Manual stage: needs build/compile_commands.json. Run with `just tidy`.
  - repo: local
    hooks:
      - id: clang-tidy
        name: clang-tidy
        entry: clang-tidy -p build
        language: system
        files: ^source/(?!zephyr/|freertos/).*\.c$
        stages: [manual]
